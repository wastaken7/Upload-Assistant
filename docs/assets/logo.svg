<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Obsidian Warm Dark) -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a09" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>

    <!-- Node Source Gradient (Charcoal Stone) -->
    <linearGradient id="node-src-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#713f12" />
      <stop offset="100%" stop-color="#422006" />
    </linearGradient>

    <!-- Node P2P Gradient (Copper) -->
    <linearGradient id="node-p2p-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#713f12" />
      <stop offset="100%" stop-color="#422006" />
    </linearGradient>

    <!-- Node Usenet Gradient (Gold) -->
    <linearGradient id="node-usenet-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#713f12" />
      <stop offset="100%" stop-color="#422006" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <style>
    /* 1. CLI Prompt Cursor Blinking */
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .cursor {
      animation: blink 1.2s step-end infinite;
    }

    /* 2. Pipeline Flow Animation */
    @keyframes flow-forward {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -60; }
    }
    .flow-copper {
      stroke-dasharray: 20 40;
      animation: flow-forward 2.2s linear infinite;
    }
    .flow-gold {
      stroke-dasharray: 20 40;
      animation: flow-forward 2.2s linear infinite;
    }

    /* 3. Usenet Document Typing Effect */
    @keyframes write-line {
      0%, 15% { stroke-dashoffset: 10; }
      50%, 85% { stroke-dashoffset: 0; }
      95%, 100% { stroke-dashoffset: 10; }
    }
    .usenet-line1 {
      stroke-dasharray: 10;
      animation: write-line 4s ease-in-out infinite;
    }
    .usenet-line2 {
      stroke-dasharray: 10;
      animation: write-line 4s ease-in-out infinite;
      animation-delay: 0.4s;
    }

    /* 4. P2P Mesh Network Animation Timeline */
    /* Pop center node */
    @keyframes pop-center {
      0% { opacity: 0; transform: scale(0); }
      10%, 85% { opacity: 1; transform: scale(1); }
      92%, 100% { opacity: 0; transform: scale(0); }
    }
    .p2p-center {
      transform-origin: 340px 160px;
      animation: pop-center 4s ease-in-out infinite;
    }

    /* Grow inner spokes */
    @keyframes draw-spoke {
      0%, 12% { stroke-dashoffset: 18; opacity: 0; }
      13% { opacity: 1; }
      30%, 85% { stroke-dashoffset: 0; opacity: 1; }
      92%, 100% { stroke-dashoffset: 18; opacity: 0; }
    }
    .p2p-spoke {
      stroke-dasharray: 18;
      animation: draw-spoke 4s ease-in-out infinite;
    }

    /* Pop satellites */
    @keyframes pop-satellite {
      0%, 30% { opacity: 0; transform: scale(0); }
      40%, 85% { opacity: 1; transform: scale(1); }
      92%, 100% { opacity: 0; transform: scale(0); }
    }
    .p2p-satellite {
      animation: pop-satellite 4s ease-in-out infinite;
    }
    .p2p-sat-right { transform-origin: 358px 160px; }
    .p2p-sat-bottom { transform-origin: 340px 178px; }
    .p2p-sat-left { transform-origin: 322px 160px; }
    .p2p-sat-top { transform-origin: 340px 142px; }

    /* Grow outer rings */
    @keyframes draw-ring {
      0%, 42% { stroke-dashoffset: 26; opacity: 0; }
      43% { opacity: 1; }
      65%, 85% { stroke-dashoffset: 0; opacity: 1; }
      92%, 100% { stroke-dashoffset: 26; opacity: 0; }
    }
    .p2p-ring {
      stroke-dasharray: 26;
      animation: draw-ring 4s ease-in-out infinite;
    }
  </style>

  <!-- Card Background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg-gradient)" stroke="#292524" stroke-width="6" />

  <!-- Inner border ring -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.04" />

  <g filter="url(#shadow)">
    <!-- Connections Base (Dark/Muted Background Pipelines) -->
    <line x1="160" y1="256" x2="340" y2="160" stroke="#1c1917" stroke-width="14" stroke-linecap="round" />
    <line x1="160" y1="256" x2="340" y2="352" stroke="#1c1917" stroke-width="14" stroke-linecap="round" />

    <!-- Connection Flow Line 1 (P2P Connector: Copper & Gold Alternating Flow) -->
    <line x1="160" y1="256" x2="340" y2="160" stroke="#b45309" stroke-width="14" stroke-linecap="round" class="flow-copper" />
    <line x1="160" y1="256" x2="340" y2="160" stroke="#fbbf24" stroke-width="14" stroke-linecap="round" stroke-dashoffset="30" class="flow-gold" />

    <!-- Connection Flow Line 2 (Usenet Connector: Copper & Gold Alternating Flow) -->
    <line x1="160" y1="256" x2="340" y2="352" stroke="#b45309" stroke-width="14" stroke-linecap="round" class="flow-copper" />
    <line x1="160" y1="256" x2="340" y2="352" stroke="#fbbf24" stroke-width="14" stroke-linecap="round" stroke-dashoffset="30" class="flow-gold" />

    <!-- Source Node: CLI -->
    <circle cx="160" cy="256" r="48" fill="url(#node-src-grad)" stroke="#57534e" stroke-width="4" />
    <!-- Terminal Prompt symbol >_ -->
    <path d="M 146 244 L 158 256 L 146 268" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Blinking Cursor -->
    <path d="M 164 268 H 176" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" class="cursor" />

    <!-- P2P Node (Mesh) -->
    <circle cx="340" cy="160" r="40" fill="url(#node-p2p-grad)" stroke="#b45309" stroke-width="4" />
    <!-- Mesh Network Connections -->
    <line x1="340" y1="160" x2="358" y2="160" stroke="#ffffff" stroke-width="2" class="p2p-spoke" />
    <line x1="340" y1="160" x2="340" y2="178" stroke="#ffffff" stroke-width="2" class="p2p-spoke" />
    <line x1="340" y1="160" x2="322" y2="160" stroke="#ffffff" stroke-width="2" class="p2p-spoke" />
    <line x1="340" y1="160" x2="340" y2="142" stroke="#ffffff" stroke-width="2" class="p2p-spoke" />

    <line x1="358" y1="160" x2="340" y2="178" stroke="#ffffff" stroke-width="2" stroke-opacity="0.6" class="p2p-ring" />
    <line x1="340" y1="178" x2="322" y2="160" stroke="#ffffff" stroke-width="2" stroke-opacity="0.6" class="p2p-ring" />
    <line x1="322" y1="160" x2="340" y2="142" stroke="#ffffff" stroke-width="2" stroke-opacity="0.6" class="p2p-ring" />
    <line x1="340" y1="142" x2="358" y2="160" stroke="#ffffff" stroke-width="2" stroke-opacity="0.6" class="p2p-ring" />
    <!-- Mesh Network Nodes -->
    <circle cx="340" cy="160" r="6" fill="#ffffff" class="p2p-center" />
    <circle cx="358" cy="160" r="4" fill="#ffffff" class="p2p-satellite p2p-sat-right" />
    <circle cx="340" cy="178" r="4" fill="#ffffff" class="p2p-satellite p2p-sat-bottom" />
    <circle cx="322" cy="160" r="4" fill="#ffffff" class="p2p-satellite p2p-sat-left" />
    <circle cx="340" cy="142" r="4" fill="#ffffff" class="p2p-satellite p2p-sat-top" />

    <!-- Usenet Node (Papers Stack) -->
    <circle cx="340" cy="352" r="40" fill="url(#node-usenet-grad)" stroke="#a16207" stroke-width="4" />
    <rect x="325" y="338" width="22" height="26" rx="2" fill="url(#node-usenet-grad)" stroke="#ffffff" stroke-width="3" />
    <rect x="333" y="344" width="22" height="26" rx="2" fill="url(#node-usenet-grad)" stroke="#ffffff" stroke-width="3" />
    <!-- News articles text lines (typing effect) -->
    <line x1="339" y1="351" x2="349" y2="351" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" class="usenet-line1" />
    <line x1="339" y1="357" x2="349" y2="357" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" class="usenet-line2" />
  </g>
</svg>
