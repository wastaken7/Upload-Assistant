[project]
name = "upload-assistant"
version = "4.0"
requires-python = ">=3.14"
description = "A simple tool to take the work out of uploading."
readme = "README.md"
license-files = ["LICENSE"]
authors = [
    { name = "wastaken7" },
]
maintainers = [
    { name = "wastaken7" },
]
keywords = ["media", "torrent", "upload-assistant"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia",
    "Topic :: Utilities",
]
dependencies = [
    "aiofiles==25.1.0",
    "aiohttp==3.14.3",
    "anitopy==2.1.1",
    "argcomplete>=3.7.2",
    "argon2-cffi==25.1.0",
    "babel==2.17.0",
    "bbcode==1.1.0",
    "beautifulsoup4==4.14.2",
    "bencode-py==4.0.0",
    "cachelib==0.13.0",
    "certifi==2026.1.4",
    "cli-ui==0.19.0",
    "click==8.4.2",
    "cloudscraper==1.2.71",
    "cryptography==50.0.0",
    "defusedxml==0.7.1",
    "deluge-client==1.10.2",
    "discord-py==2.6.4",
    "ffmpeg-python==0.2.0",
    "flask==3.1.3",
    "flask-cors==6.0.2",
    "flask-limiter==3.11.0",
    "flask-session==0.8.0",
    "guessit==3.8.0",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "keyring==25.6.0",
    "langcodes==3.5.1",
    "language-data==1.4.0",
    "librosa>=1.0.0",
    "lxml==6.1.0",
    "matplotlib>=3.10.9",
    "mobi==0.4.1",
    "mutagen==1.47.0",
    "nest-asyncio==1.6.0",
    "numpy==2.4.4",
    "packaging>=21,<25",
    "pillow==12.3.0",
    "psutil==7.2.2",
    "pycountry==24.6.1",
    "pyimgbox==1.0.7",
    "pymediainfo==7.0.1",
    "pymupdf==1.28.0",
    "pyotp==2.9.0",
    "pywinpty==3.0.5 ; sys_platform == 'win32'",
    "qbittorrent-api==2026.6.0",
    "rarfile==4.2",
    "regex==2025.11.3",
    "requests==2.33.0",
    "resvg-py==0.3.3",
    "rich==13.9.4",
    "setuptools==83.0.0",
    "tmdbsimple==2.9.1",
    "torf==4.3.0",
    "tqdm==4.67.1",
    "transmission-rpc==7.0.11",
    "typing-extensions==4.15.0",
    "unidecode==1.4.0",
    "urllib3==2.7.0",
    "waitress==3.0.2",
]

[project.urls]
Homepage = "https://github.com/wastaken7/Upload-Assistant"
Documentation = "https://github.com/wastaken7/Upload-Assistant/tree/master/docs"
Issues = "https://github.com/wastaken7/Upload-Assistant/issues"
Source = "https://github.com/wastaken7/Upload-Assistant"

[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project.scripts]
ua = "upload:run"
ua-config = "upload:run_config_generator"

[tool.setuptools]
py-modules = ["upload", "config-generator"]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["bin*", "data*", "src*", "web_ui*"]
exclude = ["tests", "tmp", "build", "build.*"]

[tool.setuptools.package-data]
data = ["tags.json", "templates/*.csv", "templates/*.json"]
web_ui = ["static/**/*", "templates/*.html"]

[tool.ruff]
line-length = 176
target-version = "py314"
exclude = [
  ".git",
  "tests",
  "__pycache__",
  ".pytest_cache",
  ".ruff_cache",
  "tmp",
]

[tool.ruff.lint]
select = [
  # Core correctness
  "E",     # pycodestyle errors
  "F",     # Pyflakes (logical and syntax errors)
  "W",     # pycodestyle warnings
  "B",     # flake8-bugbear (likely bugs and design issues)

  # Imports & modernization
  "I",     # isort (import sorting)
  "UP",    # pyupgrade (code modernization)

  # Code quality & safety
  "C4",    # flake8-comprehensions (better list/dict/set comprehension syntax)
  "SIM",   # flake8-simplify (code simplification suggestions)
  "PERF",  # Perflint (performance anti-patterns detection)
  "ARG",   # flake8-unused-arguments (unused function arguments)
  "RUF",   # Ruff-specific rules and lints
  "S",     # flake8-bandit (security testing and checks)
  "PTH",   # flake8-use-pathlib (encourage pathlib over os.path)
  "N",     # pep8-naming (naming conventions alignment)
  "RET",   # flake8-return (return statement check)

  # Dates & time
  "DTZ",   # flake8-datetimez (prevent timezone-naive datetime usage)

  # Async (if applicable)
  "ASYNC", # flake8-async (concurrency and async checks)
]
ignore = [
  "ASYNC240", # Blocking pathlib methods in async functions
  "E501",     # Line too long (line length violations)
  "S314",     # Using vulnerable xml.etree.ElementTree for XML parsing
]

[tool.ruff.lint.per-file-ignores]
"upload.py" = ["E402"]
"src/trackers/UNIT3D/UNIT3D_TEMPLATE.py" = ["N999"]

[tool.ruff.lint.isort]
known-first-party = ["data", "src", "web_ui"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
reportMissingImports = true
reportMissingTypeStubs = false
reportUnknownMemberType = true
reportUnknownVariableType = true
exclude = [
  "tests",
  "data",
  "tmp",
  "**/__pyrefly_virtual__/**",
  "**/node_modules",
  "**/__pycache__",
  "**/.*",
]

[tool.pyrefly]
disable-search-path-heuristics = true
search-path = ["."]
project-excludes = [
    "**/__pyrefly_virtual__/**",
    "**/tmp/**"
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
