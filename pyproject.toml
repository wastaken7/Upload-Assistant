[tool.ruff]
line-length = 176
target-version = "py314"
exclude = [
  ".git",
  "__pycache__",
  ".pytest_cache",
  ".ruff_cache",
  "tests",
  "data",
  "tmp",
]

[tool.ruff.lint]
select = [
  # Core correctness
  "E",
  "F",
  "W",
  "B",

  # Imports & modernization
  "I",
  "UP",

  # Code quality & safety
  "C4",
  "SIM",
  "PERF",
  "ARG",
  "RUF",
  "S",
  "PTH",
  "N",
  "RET",

  # Dates & time
  "DTZ",

  # Async (if applicable)
  "ASYNC",
]
ignore = ["E501", "UP045", "ASYNC240"]

[tool.ruff.lint.per-file-ignores]
"upload.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["cogs", "data", "src", "web_ui"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportMissingImports = true
reportMissingTypeStubs = false
reportUnknownMemberType = true
reportUnknownVariableType = true
exclude = [
  "tests",
  "data",
  "tmp",
  "**/__pyrefly_virtual__/**"
]

[tool.pyrefly]
disable-search-path-heuristics = true
search-path = ["."]
project-excludes = [
    "**/__pyrefly_virtual__/**",
    "**/tmp/**"
]