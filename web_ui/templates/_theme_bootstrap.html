<script>
  (() => {
    const root = document.documentElement;
    const supportedThemes = new Set([
      "amber",
      "amethyst",
      "charcoal",
      "evergreen",
      "graphite",
      "midnight",
      "obsidian",
    ]);

    try {
      const storedTheme = localStorage.getItem("ua_color_theme");
      root.dataset.uaTheme = supportedThemes.has(storedTheme)
        ? storedTheme
        : "amber";
      root.dataset.uaMode =
        localStorage.getItem("ua_config_theme") === "light" ? "light" : "dark";
      root.dataset.uaShape =
        localStorage.getItem("ua_interface_style") === "square"
          ? "square"
          : "rounded";
    } catch (error) {
      root.dataset.uaTheme = "amber";
      root.dataset.uaMode = "dark";
      root.dataset.uaShape = "rounded";
    }
  })();
</script>
