<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload-Assistant Web UI - Recovery Login</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="{{ url_for('static', filename='img/logo.svg') }}"
    />
    <link
      rel="alternate icon"
      type="image/png"
      href="{{ url_for('static', filename='img/logo.png') }}"
    />
    <link
      rel="apple-touch-icon"
      sizes="512x512"
      href="{{ url_for('static', filename='img/apple-touch-icon.png') }}"
    />
    <link
      rel="manifest"
      href="{{ url_for('static', filename='manifest.webmanifest') }}"
    />
    <meta name="apple-mobile-web-app-title" content="Upload-Assistant" />
    <meta name="theme-color" content="#171615" />
    <link
      rel="shortcut icon"
      href="{{ url_for('static', filename='favicon.ico') }}"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    {% include "_theme_bootstrap.html" %}
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/theme.css') }}"
    />
  </head>
  <body class="ua-auth-page">
    <main class="ua-auth-shell">
      <section class="ua-auth-card" aria-labelledby="auth-title">
        <header class="ua-auth-header">
          <img
            src="{{ url_for('static', filename='img/logo.svg') }}"
            alt=""
            class="ua-auth-logo"
          />
          <p class="ua-auth-eyebrow">Upload Assistant</p>
          <h1 id="auth-title" class="ua-auth-title">Recovery login</h1>
          <p class="ua-auth-subtitle">
            Use a one-time recovery code to sign in.
          </p>
        </header>

        <div class="ua-auth-content">
          {% if error %}
          <div class="ua-auth-error" role="alert">{{ error }}</div>
          {% endif %}

          <form method="post" action="/login/recovery" class="ua-auth-form">
            <div class="ua-auth-field">
              <label class="ua-auth-label" for="username">Username</label>
              <input
                class="ua-auth-input"
                id="username"
                name="username"
                type="text"
                autocomplete="username"
                autocapitalize="none"
                spellcheck="false"
                required
              />
            </div>

            <div class="ua-auth-field">
              <label class="ua-auth-label" for="password">Password</label>
              <input
                class="ua-auth-input"
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
              />
            </div>

            <div class="ua-auth-field">
              <label class="ua-auth-label" for="recovery_code"
                >Recovery code</label
              >
              <input
                class="ua-auth-input ua-auth-code-input"
                id="recovery_code"
                name="recovery_code"
                type="text"
                autocomplete="off"
                autocapitalize="characters"
                spellcheck="false"
                required
              />
            </div>

            <label class="ua-auth-remember" for="remember">
              <input
                class="ua-auth-checkbox"
                type="checkbox"
                id="remember"
                name="remember"
                value="1"
              />
              <span>Remember me</span>
            </label>

            <button class="ua-auth-submit" type="submit">
              Use recovery code
            </button>
          </form>

          <div class="ua-auth-alternate ua-auth-alternate-centered">
            <a href="/login">Back to sign in</a>
          </div>

          <footer class="ua-auth-footer">
            <a
              href="https://github.com/wastaken7/Upload-Assistant"
              target="_blank"
              rel="noopener noreferrer"
            >
              <svg
                aria-hidden="true"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"
                ></path>
                <path d="M9 18c-4.51 2-5-2-7-2"></path>
              </svg>
              View on GitHub
            </a>
          </footer>
        </div>
      </section>
    </main>
  </body>
</html>
