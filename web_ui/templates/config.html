<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload-Assistant - Config</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="{{ url_for('static', filename='img/logo.svg') }}"
    />
    <link
      rel="alternate icon"
      type="image/png"
      href="{{ url_for('static', filename='img/logo.png') }}"
    />
    <link
      rel="apple-touch-icon"
      sizes="512x512"
      href="{{ url_for('static', filename='img/apple-touch-icon.png') }}"
    />
    <link
      rel="manifest"
      href="{{ url_for('static', filename='manifest.webmanifest') }}"
    />
    <meta name="apple-mobile-web-app-title" content="Upload-Assistant" />
    <meta name="theme-color" content="#171615" />
    {% include "_theme_bootstrap.html" %}
    <link
      rel="shortcut icon"
      href="{{ url_for('static', filename='favicon.ico') }}"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/theme.css') }}"
    />
  </head>
  <body>
    <div id="page-root">
      <div
        id="page-root-loading"
        class="ua-startup-screen"
        role="status"
        aria-live="polite"
      >
        <div class="ua-startup-card">
          <div class="ua-startup-brand">
            <span class="ua-startup-logo-frame" aria-hidden="true">
              <img
                class="ua-startup-logo"
                src="{{ url_for('static', filename='img/logo.svg') }}"
                alt=""
              />
            </span>
            <div>
              <p class="ua-startup-eyebrow">
                Upload Assistant · {{ app_version }}
              </p>
              <h1 class="ua-startup-title">Preparing configuration</h1>
            </div>
          </div>
          <p class="ua-startup-description">
            Loading settings and administration controls.
          </p>
          <div class="ua-startup-progress-track" aria-hidden="true">
            <span class="ua-startup-progress-bar"></span>
          </div>
          <p class="ua-startup-delayed-hint">
            Taking longer than expected? Check that this browser can reach the
            required CDN resources.
          </p>
        </div>
      </div>
      <noscript>
        <style>
          #page-root-loading {
            display: none;
          }
        </style>
        JavaScript is required for the Configuration page.
      </noscript>
    </div>
    <script>
      window.UA_LOGO_URL = {{ url_for('static', filename='img/logo.svg') | tojson }};
      window.UA_APP_VERSION = {{ app_version | tojson }};
      window.UA_CSRF_TOKEN = {{ csrf_token | tojson }};
    </script>
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.production.min.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script
      type="text/javascript"
      src="{{ url_for('static', filename='js/shared_utils.js') }}"
    ></script>
    <script
      type="text/javascript"
      src="{{ url_for('static', filename='js/config_image_host_fallback.js') }}"
    ></script>
    <script
      type="text/babel"
      src="{{ url_for('static', filename='js/config_app.js') }}"
    ></script>
  </body>
</html>
