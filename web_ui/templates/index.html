<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload-Assistant</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="{{ url_for('static', filename='img/logo.svg') }}"
    />
    <link
      rel="alternate icon"
      type="image/png"
      href="{{ url_for('static', filename='img/logo.png') }}"
    />
    <link
      rel="apple-touch-icon"
      sizes="512x512"
      href="{{ url_for('static', filename='img/apple-touch-icon.png') }}"
    />
    <link
      rel="manifest"
      href="{{ url_for('static', filename='manifest.webmanifest') }}"
    />
    <meta name="apple-mobile-web-app-title" content="Upload-Assistant" />
    <meta name="theme-color" content="#0f1012" />
    {% include "_theme_bootstrap.html" %}
    <link
      rel="shortcut icon"
      href="{{ url_for('static', filename='favicon.ico') }}"
    />
    <!-- Tailwind Play CDN 3.4.17, self-hosted: its CDN omits CORS headers, so SRI cannot be used. -->
    <script src="{{ url_for('static', filename='js/vendor/tailwindcss-3.4.17.js') }}"></script>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/theme.css') }}"
    />
    <style>
      /* Rich output area styling (keeps preformatted blocks readable) */
      #rich-output pre {
        white-space: pre-wrap;
        font-family: monospace;
      }
      /* Smaller text output for mobile */
      @media (max-width: 767px) {
        #rich-output pre {
          font-size: 0.75rem;
          line-height: 1.25rem;
        }
        #rich-output {
          font-size: 0.75rem;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div
        id="root-loading"
        class="ua-startup-screen"
        role="status"
        aria-live="polite"
      >
        <div class="ua-startup-card">
          <div class="ua-startup-brand">
            <span class="ua-startup-logo-frame" aria-hidden="true">
              <img
                class="ua-startup-logo"
                src="{{ url_for('static', filename='img/logo.svg') }}"
                alt=""
              />
            </span>
            <div>
              <p class="ua-startup-eyebrow">
                Upload Assistant · {{ app_version }}
              </p>
              <h1 class="ua-startup-title">Preparing upload workspace</h1>
            </div>
          </div>
          <p class="ua-startup-description">
            Loading your files, arguments, and workspace controls.
          </p>
          <div class="ua-startup-progress-track" aria-hidden="true">
            <span class="ua-startup-progress-bar"></span>
          </div>
          <p class="ua-startup-delayed-hint">
            Taking longer than expected? Check that this browser can reach the
            required CDN resources.
          </p>
        </div>
      </div>
      <noscript>
        <style>
          #root-loading {
            display: none;
          }
        </style>
        JavaScript is required for the Upload page.
      </noscript>
    </div>
    <script>
      window.UA_APP_VERSION = {{ app_version | tojson }};
      window.UA_CSRF_TOKEN = {{ csrf_token | tojson }};
      window.UA_CLI_ARGUMENTS = {{ cli_arguments | tojson }};
      window.UA_MAX_UPLOAD_PATHS = {{ max_upload_paths | tojson }};
    </script>
    <script
      src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"
      integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"
      integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.10/babel.min.js"
      integrity="sha384-DvKInD++yy7A2BLvCHTGeQpbzHFQ/fygXywfI/wco5cjKN4A+mE48ib8UE8FiW0o"
      crossorigin="anonymous"
    ></script>
    <!-- DOMPurify for sanitizing Rich-generated HTML fragments -->
    <script
      src="https://cdn.jsdelivr.net/npm/dompurify@3.2.7/dist/purify.min.js"
      integrity="sha384-qJNkHwhlYywDHfyoEe1np+1lYvX/8x+3gHCKFhSSBMQyCFlvFnn+zXmaebXl21rV"
      crossorigin="anonymous"
    ></script>
    {% if screenshot_mode %}
    <script src="{{ url_for('static', filename='js/screenshot_mode.js') }}"></script>
    {% endif %}
    <script
      type="text/javascript"
      src="{{ url_for('static', filename='js/shared_utils.js') }}"
    ></script>
    <script src="{{ url_for('static', filename='js/api_key_status.js') }}"></script>
    <script src="{{ url_for('static', filename='js/prompt_sound.js') }}"></script>
    <script src="{{ url_for('static', filename='js/language_flags_data.js') }}"></script>
    <script src="{{ url_for('static', filename='js/language_flags.js') }}"></script>
    <script src="{{ url_for('static', filename='js/run_gui_state.js') }}"></script>
    <script src="{{ url_for('static', filename='js/tracker_layout.js') }}"></script>
    <script src="{{ url_for('static', filename='js/unit3d_bbcode.js') }}"></script>
    <script src="{{ url_for('static', filename='js/argument_builder.js') }}"></script>
    <script
      type="text/babel"
      src="{{ url_for('static', filename='js/app.js') }}"
    ></script>
  </body>
</html>
