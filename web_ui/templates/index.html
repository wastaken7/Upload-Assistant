<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload-Assistant</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="{{ url_for('static', filename='img/logo.svg') }}"
    />
    <link
      rel="alternate icon"
      type="image/png"
      href="{{ url_for('static', filename='img/logo.png') }}"
    />
    <link
      rel="apple-touch-icon"
      sizes="512x512"
      href="{{ url_for('static', filename='img/apple-touch-icon.png') }}"
    />
    <link
      rel="manifest"
      href="{{ url_for('static', filename='manifest.webmanifest') }}"
    />
    <meta name="apple-mobile-web-app-title" content="Upload-Assistant" />
    <meta name="theme-color" content="#171615" />
    {% include "_theme_bootstrap.html" %}
    <link
      rel="shortcut icon"
      href="{{ url_for('static', filename='favicon.ico') }}"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/theme.css') }}"
    />
    <style>
      /* Rich output area styling (keeps preformatted blocks readable) */
      #rich-output pre {
        white-space: pre-wrap;
        font-family: monospace;
      }
      .bbcode-preview .xbbcode-b {
        font-weight: 700;
      }
      .bbcode-preview .xbbcode-i {
        font-style: italic;
      }
      .bbcode-preview .xbbcode-u {
        text-decoration: underline;
      }
      .bbcode-preview .xbbcode-s {
        text-decoration: line-through;
      }
      .bbcode-preview .xbbcode-center,
      .bbcode-preview .xbbcode-left,
      .bbcode-preview .xbbcode-right,
      .bbcode-preview .xbbcode-justify {
        display: block;
      }
      .bbcode-preview .xbbcode-center {
        text-align: center;
      }
      .bbcode-preview .xbbcode-left {
        text-align: left;
      }
      .bbcode-preview .xbbcode-right {
        text-align: right;
      }
      .bbcode-preview .xbbcode-justify {
        text-align: justify;
      }
      .bbcode-preview .xbbcode-code {
        display: block;
        overflow: auto;
        margin: 0.75rem 0;
        padding: 0.75rem;
        border-radius: 0.375rem;
        background: rgb(17 24 39);
        color: rgb(243 244 246);
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 0.75rem;
        line-height: 1.25rem;
        white-space: pre-wrap;
      }
      /* Smaller text output for mobile */
      @media (max-width: 767px) {
        #rich-output pre {
          font-size: 0.75rem;
          line-height: 1.25rem;
        }
        #rich-output {
          font-size: 0.75rem;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div
        id="root-loading"
        class="ua-startup-screen"
        role="status"
        aria-live="polite"
      >
        <div class="ua-startup-card">
          <div class="ua-startup-brand">
            <span class="ua-startup-logo-frame" aria-hidden="true">
              <img
                class="ua-startup-logo"
                src="{{ url_for('static', filename='img/logo.svg') }}"
                alt=""
              />
            </span>
            <div>
              <p class="ua-startup-eyebrow">
                Upload Assistant · {{ app_version }}
              </p>
              <h1 class="ua-startup-title">Preparing upload workspace</h1>
            </div>
          </div>
          <p class="ua-startup-description">
            Loading your files, arguments, and workspace controls.
          </p>
          <div class="ua-startup-progress-track" aria-hidden="true">
            <span class="ua-startup-progress-bar"></span>
          </div>
          <p class="ua-startup-delayed-hint">
            Taking longer than expected? Check that this browser can reach the
            required CDN resources.
          </p>
        </div>
      </div>
      <noscript>
        <style>
          #root-loading {
            display: none;
          }
        </style>
        JavaScript is required for the Upload page.
      </noscript>
    </div>
    <script>
      window.UA_APP_VERSION = {{ app_version | tojson }};
      window.UA_CSRF_TOKEN = {{ csrf_token | tojson }};
    </script>
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.production.min.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
    <!-- DOMPurify for sanitizing Rich-generated HTML fragments -->
    <script
      src="https://cdn.jsdelivr.net/npm/dompurify@3.2.7/dist/purify.min.js"
      integrity="sha384-qJNkHwhlYywDHfyoEe1np+1lYvX/8x+3gHCKFhSSBMQyCFlvFnn+zXmaebXl21rV"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/xbbcode-parser@0.3.1/xbbcode.min.js"
      integrity="sha384-WDYMYmCuXkFj0FX/C0kpV1U5pxmo83sVh+ZFvGHm+4umR3+3JkUokAhJrfXmj3Cj"
      crossorigin="anonymous"
    ></script>
    <script
      type="text/javascript"
      src="{{ url_for('static', filename='js/shared_utils.js') }}"
    ></script>
    <script
      type="text/babel"
      src="{{ url_for('static', filename='js/app.js') }}"
    ></script>
  </body>
</html>
