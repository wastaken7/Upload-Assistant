name: Update binary dependencies

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-binary-dependencies
  cancel-in-progress: false

jobs:
  update:
    name: Check ${{ matrix.dependency }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        dependency:
          - 7zip
          - bdinfo
          - dovi_tool
          - ffmpeg
          - hdr10plus_tool
          - mkbrr
          - nyuu
          - par2
          - pesto
    steps:
      - name: Check out development
        uses: actions/checkout@v4
        with:
          ref: development

      - name: Check latest stable release
        id: update
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.update_binary_dependency "${{ matrix.dependency }}"

      - name: Prepare empty pull request body
        if: steps.update.outputs.changed == 'true'
        run: touch "$RUNNER_TEMP/empty-pr-body.md"

      - name: Create or refresh pull request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          base: development
          branch: automation/bin-dependency-${{ matrix.dependency }}
          delete-branch: true
          commit-message: "chore(deps): update ${{ matrix.dependency }} to ${{ steps.update.outputs.version }}"
          title: "chore(deps): update ${{ matrix.dependency }} to ${{ steps.update.outputs.version }}"
          body-path: ${{ runner.temp }}/empty-pr-body.md
          add-paths: |
            bin/binary_dependencies.py
            bin/download_integrity.py
