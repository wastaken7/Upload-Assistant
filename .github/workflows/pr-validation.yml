name: PR validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  python-compatibility:
    name: Python 3.14 compatibility
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall src web_ui upload.py

  tests:
    name: Pytest (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Ubuntu
            runner: ubuntu-24.04
          - os: Windows
            runner: windows-2025
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pytest pytest-asyncio

      - name: Create test configuration
        shell: pwsh
        run: Copy-Item data/example_config.py data/config.py

      - name: Run pytest
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q

  docker-build:
    name: Docker build validation (${{ matrix.arch }})
    needs: python-compatibility
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          provenance: false
          cache-from: type=gha,scope=pr-webui-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=pr-webui-${{ matrix.arch }}
          push: false
