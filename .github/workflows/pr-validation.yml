name: PR validation

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

# A new push to the same pull request supersedes the previous run.
concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Docker-relevant changes
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - name: Check changed files
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Build the image only when files that shape it change. If the file list
          # cannot be read, build anyway rather than skip the validation.
          docker=true
          if files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename'); then
            if ! grep -qE '^(Dockerfile|\.dockerignore|requirements\.txt|uv\.lock|pyproject\.toml|bin/|scripts/docker-entrypoint\.sh|\.github/workflows/pr-validation\.yml)' <<<"$files"; then
              docker=false
            fi
          fi
          echo "docker=$docker" >> "$GITHUB_OUTPUT"

  python-compatibility:
    name: Python ${{ matrix.python }} compatibility
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14", "3.15"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Verify dependency files
        shell: bash
        run: |
          uv lock --check
          uv export --format requirements-txt --no-hashes --no-emit-project --no-header --no-annotate --output-file "$RUNNER_TEMP/requirements.txt"
          diff -u requirements.txt "$RUNNER_TEMP/requirements.txt"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Build package wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .

      - name: Verify package assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          package_data = tomllib.loads(Path("pyproject.toml").read_text())["tool"]["setuptools"]["package-data"]
          required = {
              path.as_posix()
              for package, patterns in package_data.items()
              for pattern in patterns
              for path in Path(package).glob(pattern)
              if path.is_file() and not path.name.startswith(".")
          }
          with ZipFile(wheel) as archive:
              members = set(archive.namelist())
              missing = required - members
          if missing:
              raise SystemExit(f"Wheel is missing: {', '.join(sorted(missing))}")
          forbidden = {"data/config.py", "requirements.txt"} & members
          if forbidden:
              raise SystemExit(f"Wheel contains local-only files: {', '.join(sorted(forbidden))}")
          PY

      - name: Compile Python sources
        run: python -m compileall src web_ui upload.py

  tests:
    name: Pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        os: [Ubuntu, Windows]
        python: ["3.14", "3.15"]
        include:
          - os: Ubuntu
            runner: ubuntu-24.04
          - os: Windows
            runner: windows-2025
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pytest pytest-asyncio

      - name: Run pytest
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q

  docker-build:
    name: Docker build validation (${{ matrix.arch }})
    needs: [changes, python-compatibility]
    if: needs.changes.outputs.docker == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          provenance: false
          # No GitHub Actions cache here: each pull request gets its own cache
          # scope that no other pull request can read, so a mode=max export
          # only filled the 10 GB repository quota with ~1 GB of layers per build.
          push: false
