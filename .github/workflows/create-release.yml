name: Create release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version (for example: v2.8 or v2.8.1)"
        required: true
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: create-release
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-24.04
    outputs:
      release_sha: ${{ steps.version_commit.outputs.release_sha }}
    steps:
      - name: Check out the selected branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Validate version
        env:
          NEW_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$REF_TYPE" != "branch" ]]; then
            echo "Create release must be run from a branch, not a tag." >&2
            exit 1
          fi

          if [[ ! "$NEW_VERSION" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Version must match vMAJOR.MINOR or vMAJOR.MINOR.PATCH (for example: v2.8)." >&2
            exit 1
          fi

          if git rev-parse --verify --quiet "refs/tags/$NEW_VERSION"; then
            echo "Tag $NEW_VERSION already exists." >&2
            exit 1
          fi

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_VERSION: ${{ inputs.version }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$NEW_VERSION" \
            -f target_commitish="$GITHUB_SHA" \
            --jq .body > "$RUNNER_TEMP/release-notes.md"

      - name: Save release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes-${{ inputs.version }}
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error

      - name: Update src/version.py
        env:
          NEW_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          path = Path("src/version.py")
          content = path.read_text(encoding="utf-8")
          notes = Path(os.environ["RUNNER_TEMP"], "release-notes.md").read_text(encoding="utf-8").strip()
          serialized_notes = json.dumps(notes, ensure_ascii=False)
          replacement = f'__version__ = "{os.environ["NEW_VERSION"]}"\n\n{serialized_notes}'
          updated, count = re.subn(
              r'__version__\s*=\s*"[^"]+"\s*\n\s*(?:""".*?"""|"(?:\\.|[^"\\])*")',
              lambda _match: replacement,
              content,
              count=1,
              flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit("Could not find the version and release-notes block in src/version.py")
          path.write_text(updated, encoding="utf-8")

          path = Path("pyproject.toml")
          content = path.read_text(encoding="utf-8")
          updated, count = re.subn(
              r'^version\s*=\s*"[^"]+"',
              f'version = "{os.environ["NEW_VERSION"].removeprefix("v")}"',
              content,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit("Could not find the project version in pyproject.toml")
          path.write_text(updated, encoding="utf-8")
          PY

      - name: Update locked dependencies
        run: |
          uv lock
          uv export --format requirements-txt --no-hashes --no-emit-project --no-header --no-annotate --output-file requirements.txt

      - name: Commit the version bump
        id: version_commit
        env:
          NEW_VERSION: ${{ inputs.version }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/version.py pyproject.toml uv.lock requirements.txt
          git diff --cached --check
          git commit -m "bump: version to ${NEW_VERSION#v}"
          git push origin "HEAD:$TARGET_BRANCH"
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-windows-installer:
    needs: prepare-release
    uses: ./.github/workflows/windows-installer.yml
    with:
      ref: ${{ needs.prepare-release.outputs.release_sha }}
      version: ${{ inputs.version }}

  build-python-distribution:
    needs: prepare-release
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Build wheel and source distribution
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check dist/*

      - name: Verify local configuration is excluded
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          sdist = next(Path("dist").glob("*.tar.gz"))
          with ZipFile(wheel) as archive:
              wheel_members = set(archive.namelist())
          with tarfile.open(sdist) as archive:
              sdist_members = {Path(name).as_posix() for name in archive.getnames()}

          forbidden_wheel = {"data/config.py", "requirements.txt"} & wheel_members
          forbidden_sdist = {
              name
              for name in sdist_members
              if name.endswith(("/data/config.py", "/requirements.txt"))
          }
          if forbidden_wheel or forbidden_sdist:
              raise SystemExit(f"Distribution contains local-only files: {sorted(forbidden_wheel | forbidden_sdist)}")
          PY

      - name: Save Python distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions-${{ inputs.version }}
          path: dist/
          if-no-files-found: error

  publish-release:
    needs: [prepare-release, build-windows-installer, build-python-distribution]
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
    steps:
      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes-${{ inputs.version }}
          path: ${{ runner.temp }}

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: Upload-Assistant-Windows-Setup-${{ inputs.version }}
          path: ${{ runner.temp }}/windows-installer

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEW_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ needs.prepare-release.outputs.release_sha }}
        run: |
          gh release create "$NEW_VERSION" \
            --target "$RELEASE_SHA" \
            --title "$NEW_VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "$RUNNER_TEMP/windows-installer"/*.exe \
            --verify-tag=false

      - name: Start Docker release build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEW_VERSION: ${{ inputs.version }}
        run: |
          gh workflow run docker-image.yml --ref "$NEW_VERSION" -f use_latest_tag=true

  publish-pypi:
    needs: [prepare-release, publish-release]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/upload-assistant
    permissions:
      id-token: write
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions-${{ inputs.version }}
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
